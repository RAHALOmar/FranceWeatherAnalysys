version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: weather_postgres

    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  etl:
    build: .

    container_name: weather_etl

    depends_on:
      - postgres

    env_file:
      - .env

    volumes:
      - .:/app

volumes:
  postgres_data:
